services:
  api:
    build: .
    container_name: ai_automation_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - qdrant_data:/app/qdrant_storage

  postgres:
    image: postgres:16
    container_name: ai_automation_postgres
    environment:
      POSTGRES_DB: ai_automation
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_automation_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data: